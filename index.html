<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
    <title>Profile Card Component</title>
  </head>
  <body>
    <article class="profile-card">
      <header class="profile-card-header">
        <div class="profile-avatar">
          <img
            src="images/image-victor.jpg"
            alt="Victor Crest's profile picture"
          />
        </div>
      </header>
      <section class="profile-card-info">
        <h1 class="profile-card-name">
          Victor Crest <span class="profile-card-age"> 26</span>
        </h1>
        <p class="profile-card-location">London</p>
      </section>
      <hr class="custom-line" />
      <section class="profile-card-stat-group" aria-label="User statistics">
        <div class="profile-card-stat">
          <h2 class="profile-card-stat-number">80K</h2>
          <p class="profile-card-stat-label">Followers</p>
        </div>
        <div class="profile-card-stat">
          <h2 class="profile-card-stat-number">803K</h2>
          <p class="profile-card-stat-label">Likes</p>
        </div>
        <div class="profile-card-stat">
          <h2 class="profile-card-stat-number">1.4K</h2>
          <p class="profile-card-stat-label">Photos</p>
        </div>
      </section>
    </article>
  </body>
</html>
